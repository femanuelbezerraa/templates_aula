<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Editar Produto</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='editar.css') }}">
</head>
<body>
    <div class="container">
        <h2>Editar Produto</h2>
        <form method="post" action="{{ url_for('editar_produto') }}">
            <input type="hidden" name="id" value="{{ produto.id }}">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" value="{{ produto.nome }}" required><br>
            <label for="descricao">Descrição:</label>
            <input type="text" id="descricao" name="descricao" value="{{ produto.descricao }}"><br>
            <label for="quantidade">Quantidade:</label>
            <input type="number" id="quantidade" name="quantidade" value="{{ produto.quantidade }}" required><br>
            <label for="quantidade_minima">Quantidade Mínima:</label>
            <input type="number" id="quantidade_minima" name="quantidade_minima" value="{{ produto.quantidade_minima }}"><br>
            <label for="preco">Preço:</label>
            <input type="number" step="0.01" id="preco" name="preco" value="{{ produto.preco }}"><br>
            <button type="submit">Salvar</button>
        </form>
        <a href="{{ url_for('estoque') }}">Voltar ao Estoque</a>
    </div>
</body>
</html>
